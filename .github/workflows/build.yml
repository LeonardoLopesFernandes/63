name: Build Papeleta63 APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Setup keystore from Secrets
        run: |
          RAW="${{ secrets.KEYSTORE_BASE64 }}"
          CLEAN=$(echo "$RAW" | tr -d '\n\r\t ')
          echo "$CLEAN" | base64 --decode > android/app/upload.keystore
          echo "Keystore size: $(wc -c < android/app/upload.keystore) bytes"

      - name: Verify keystore
        run: |
          keytool -list -v -keystore android/app/upload.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" 2>&1

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get (after clean)
        run: flutter pub get

      - name: Build APK (arm64, release)
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.0

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/63_flutter.apk && ls -la build/app/outputs/flutter-apk/63_flutter.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 63_flutter-apk
          path: build/app/outputs/flutter-apk/63_flutter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Papeleta63 ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/63_flutter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
