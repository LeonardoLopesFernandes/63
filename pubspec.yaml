name: papeleta63
description: "Papeleta63 - app de etiquetas promocionais (port fiel do Kotlin)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.7.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.3
  shared_preferences: ^2.3.2
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  cronet_http: ^1.2.0
  http: ^1.2.0
  app_links: ^6.1.0
  mobile_scanner: ^6.0.0
  image_picker: ^1.0.7
  pdf: ^3.11.1
  share_plus: ^10.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/celulares.json
    - assets/logo.png
    - assets/logo_preto.png
    - assets/ic_papeleta.png
    - assets/fonts/
